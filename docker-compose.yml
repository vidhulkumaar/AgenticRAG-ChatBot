version: '3.8'

services:
  # ── Backend: FastAPI + ChromaDB + SentenceTransformers + Groq ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - EMBED_MODEL=${EMBED_MODEL:-all-MiniLM-L6-v2}
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - PORT=8000
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
    networks:
      - rag_network

  # ── Frontend: React 18 + Vite + Nginx ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentic_rag_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag_network

volumes:
  chroma_data:
  uploads_data:

networks:
  rag_network:
    driver: bridge
